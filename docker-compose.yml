version: "3.9"

services:
  postgres:
    # pgvector image = Postgres 16 + the "vector" extension (for semantic search).
    # Drop-in replacement for postgres:16; keeps the same pg_data volume/data.
    image: pgvector/pgvector:pg16
    container_name: pg-secondhand
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secondhand
    ports:
      - "5432:5432"           # same port all services will use
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d  # runs *.sql on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secondhand"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      - postgres

  mongo:
    image: mongo:7
    container_name: mongo-secondhand
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
