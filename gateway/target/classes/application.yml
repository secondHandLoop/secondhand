server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=0
        - id: message
          uri: http://localhost:8082
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=0
        - id: note
          uri: http://localhost:8083
          predicates:
            - Path=/note/**
          filters:
            - StripPrefix=0
