server:
  port: 7100

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:7200"
              - "http://127.0.0.1:7200"
              - "http://localhost:7201"
              - "http://127.0.0.1:7201"
              - "http://localhost:4173"
              - "http://127.0.0.1:4173"
              - "http://100.107.78.159:7200"
              - "capacitor://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # StripPrefix=0 removed: it strips zero path segments, i.e. a no-op.
        - id: user
          uri: http://localhost:7101
          predicates:
            - Path=/user/**
        - id: message
          uri: http://localhost:7103
          predicates:
            - Path=/message/**
        - id: note
          uri: http://localhost:7102
          predicates:
            - Path=/note/**
