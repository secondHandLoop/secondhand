server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/secondhand?currentSchema=note_svc
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
    default-schema: note_svc
    schemas: note_svc
