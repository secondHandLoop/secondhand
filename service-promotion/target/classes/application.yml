server:
  port: 7104

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/secondhand?currentSchema=promotion_svc
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
    default-schema: promotion_svc
    schemas: promotion_svc
